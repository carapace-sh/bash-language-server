name: Build binary

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            os: linux
          - platform: macos-latest
            os: macos
          - platform: windows-latest
            os: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build:bundle

      - name: Determine output filename
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            echo "ASSET_NAME=bash-language-server.exe" >> $GITHUB_ENV
          else
            echo "ASSET_NAME=bash-language-server" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-language-server-${{ matrix.os }}-x64
          path: bash-language-server
          retention-days: 5

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bash-language-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
