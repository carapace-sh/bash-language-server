name: Release

on:
  push:
    branches:
      - carapace
    tags:
      - 'carapace-server-*'

jobs:
  build:
    strategy:
      matrix:
        platform:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
        architecture:
          - arch: x64
          - arch: arm64

    runs-on: ${{ matrix.platform.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile
        run: bun run compile

      - name: Build
        run: |
          cd server
          bun run build:bundle
          mv bash-language-server ../bash-language-server

      - name: Determine output filename
        run: |
          if [ "${{ matrix.platform.os }}" = "windows" ]; then
            echo "ASSET_NAME=bash-language-server-${{ matrix.architecture.arch }}" >> $GITHUB_ENV
            echo "BINARY_NAME=bash-language-server.exe" >> $GITHUB_ENV
          else
            echo "ASSET_NAME=bash-language-server-${{ matrix.architecture.arch }}" >> $GITHUB_ENV
            echo "BINARY_NAME=bash-language-server" >> $GITHUB_ENV
          fi

      - name: Create distribution package
        run: |
          cd server
          mkdir -p dist
          mv bash-language-server dist/
          cp tree-sitter-bash.wasm dist/
          cp out/get-options.sh dist/
          cd dist
          if [ "${{ matrix.platform.os }}" = "windows" ]; then
            powershell -Command "Compress-Archive -Path * -DestinationPath ../bash-language-server-${{ matrix.architecture.arch }}.zip"
          else
            tar -czf ../bash-language-server-${{ matrix.architecture.arch }}.tar.gz .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            server/bash-language-server-${{ matrix.architecture.arch }}.zip
            server/bash-language-server-${{ matrix.architecture.arch }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/carapace-server-')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract archives
        run: |
          cd artifacts
          for dir in */; do
            if [[ "$dir" =~ \.tar\.gz$ ]]; then
              continue
            fi
            cd "$dir"
            for archive in *.tar.gz *.zip; do
              if [ -f "$archive" ]; then
                if [[ "$archive" == *.tar.gz ]]; then
                  tar -xzf "$archive"
                else
                  unzip -o "$archive"
                fi
              fi
            done
            cd ..
          done
          ls -la */

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/bash-language-server-*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
