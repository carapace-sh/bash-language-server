name: Release

on:
  push:
    branches:
      - carapace
    tags:
      - 'carapace-server-*'

jobs:
  build:
    strategy:
      matrix:
        platform:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
        architecture:
          - arch: x64
          - arch: arm64

    runs-on: ${{ matrix.platform.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile
        run: bun run compile

      - name: Build bundle
        run: bun run build:bundle

      - name: Determine output filename
        if: runner.os == 'Windows'
        run: |
          echo "ASSET_NAME=bash-language-server-${{ matrix.architecture.arch }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "BINARY_NAME=bash-language-server.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine output filename
        if: runner.os != 'Windows'
        run: |
          echo "ASSET_NAME=bash-language-server-${{ matrix.architecture.arch }}" >> $GITHUB_ENV
          echo "BINARY_NAME=bash-language-server" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: server/${{ env.BINARY_NAME }}
          retention-days: 5

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/carapace-server-')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/bash-language-server-*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
